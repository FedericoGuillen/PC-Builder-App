<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>BuildLab - Modo Libre</title>
    <style>
        /* Variables de colores (Estilo BuildLab) */
        :root {
            --bg-dark: #070b11;
            --bg-card: #0f1623;
            --text-main: #ffffff;
            --text-muted: #8b949e;
            --accent-blue: #58a6ff;
            --border-color: #273045;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            /* Resplandor de fondo unificado */
            background-image: radial-gradient(circle at 50% 30%, rgba(15, 30, 50, 0.6) 0%, transparent 70%);
        }
		
		/* =========================
   FONDO FUTURISTA
========================= */

.background-effects {
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    overflow: hidden;

    background:
        radial-gradient(
            ellipse at 50% 45%,
            rgba(0, 76, 145, 0.13),
            transparent 65%
        ),
        radial-gradient(
            circle at 10% 20%,
            rgba(0, 100, 255, 0.12),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 80%,
            rgba(0, 70, 200, 0.10),
            transparent 35%
        ),
        #060c14;
}

.circuit {
    position: absolute;
    width: 500px;
    height: 500px;
    opacity: 0.45;

    background:
        linear-gradient(
            135deg,
            transparent 48%,
            #0066b9 48.2%,
            transparent 48.5%
        ),
        linear-gradient(
            135deg,
            transparent 62%,
            #003b77 62.2%,
            transparent 62.5%
        ),
        linear-gradient(
            135deg,
            transparent 75%,
            #00519b 75.2%,
            transparent 75.5%
        );
}

.circuit-left {
    top: -100px;
    left: -200px;
    transform: rotate(0deg);
}

.circuit-right {
    bottom: -180px;
    right: -200px;
    transform: rotate(180deg);
}

.glow {
    position: absolute;
    width: 6px;
    height: 6px;
    background: #008cff;
    border-radius: 50%;

    box-shadow:
        0 0 8px #008cff,
        0 0 20px rgba(0, 140, 255, 0.6);
}

.glow-1 { top: 28%; left: 12%; }
.glow-2 { top: 35%; right: 13%; }
.glow-3 { bottom: 25%; left: 18%; }
.glow-4 { bottom: 20%; right: 10%; }


        /* --- Navbar Unificada --- */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: transparent;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .nav-left { display: flex; align-items: center; gap: 12px; font-weight: bold; }
        .logo-icon { width: 30px; height: 30px; border: 1px solid var(--accent-blue); border-radius: 6px; display: flex; justify-content: center; align-items: center; color: var(--accent-blue); }
        .brand-link { text-decoration: none; color: white; font-size: 1.2rem; }
        
        .nav-center { display: flex; gap: 30px; }
        .nav-center a { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
        .nav-center a:hover, .nav-center a.active { color: var(--accent-blue); }
        
        .nav-right { display: flex; align-items: center; gap: 15px; font-size: 0.85rem; color: var(--text-muted); }
        .profile-btn { background: var(--bg-card); border: 1px solid var(--border-color); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .profile-btn:hover { border-color: var(--text-muted); }

        /* --- Contenido Principal --- */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
            text-align: center;
        }

        .pre-title {
            color: var(--accent-blue);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-family: monospace;
            margin-bottom: 15px;
        }

        h1 { font-size: 2.5rem; margin-bottom: 15px; font-weight: 700; }
        .subtitle { color: var(--text-muted); font-size: 1.05rem; max-width: 600px; margin-bottom: 50px; line-height: 1.5; }

        /* --- Grilla de Categorías --- */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            width: 100%;
            max-width: 900px;
        }

        /* En la última fila, centramos los dos elementos sobrantes */
        .categories-grid .category-btn:nth-child(10) {
            grid-column: 1 / 2;
            justify-self: end;
            width: calc(100% - 10px);
        }
        .categories-grid .category-btn:nth-child(11) {
            grid-column: 2 / 3;
            justify-self: start;
            width: calc(100% - 10px);
        }

        .category-btn {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            color: var(--text-main);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .category-btn:hover {
            border-color: var(--accent-blue);
            background-color: rgba(88, 166, 255, 0.05);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
        }

        /* Footer simple */
        footer {
            padding: 20px 40px;
            display: flex;
            gap: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        footer a { color: var(--text-muted); text-decoration: none; font-weight: bold; }
        footer a:hover { color: var(--text-main); }

    </style>
</head>
